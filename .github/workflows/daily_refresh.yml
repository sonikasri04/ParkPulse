name: daily-refresh
on:
  schedule: [{cron: "0 6 * * *"}]   # 06:00 UTC every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python pipeline.py
        env: {NPS_API_KEY: "${{ secrets.NPS_API_KEY }}"}
      - name: Commit refreshed data
        run: |
          git config user.name "parkpulse-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/parkpulse.db data/daily_brief.md
          git diff --cached --quiet || (git commit -m "Daily refresh $(date -u +%F)" && git push)
